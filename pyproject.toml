[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honeytrap"
version = "1.0.0"
description = "Professional Honeypot Intrusion Detection System"
authors = [
    {name = "Manny", email = "dev@aymei-tech.com"},
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.0.7",
    "Flask-CORS==4.0.0",
    "Flask-Limiter==3.8.0",
    "psycopg2-binary==2.9.9",
    "redis==5.0.7",
    "marshmallow==3.21.1",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "geoip2==4.7.0",
    "gunicorn==22.0.0",
    "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
    "black==24.3.0",
    "flake8==7.0.0",
    "pylint==3.1.0",
    "mypy==1.10.0",
    "isort==5.13.2",
    "pytest==8.2.2",
    "pytest-flask==1.3.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.14.0",
]

docs = [
    "sphinx==7.3.7",
    "sphinx-rtd-theme==2.0.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
ensure_newline_before_comments = true
skip = [".gitignore", ".venv", "migrations"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=app --cov-report=html --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "W0703",  # broad-except
]

[tool.pylint.format]
max-line-length = 100
