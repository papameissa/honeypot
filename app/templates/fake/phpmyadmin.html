<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>phpMyAdmin</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#f8f8f8; font-family:Verdana,Arial,sans-serif; font-size:13px; }
    .pma-header {
      background:#3a3a3a; padding:6px 14px; display:flex; align-items:center; gap:12px;
    }
    .pma-logo { color:#f5a623; font-weight:bold; font-size:20px; letter-spacing:-1px; }
    .pma-version { color:#aaa; font-size:11px; }
    .pma-nav { background:#d4d4d4; border-bottom:2px solid #b0b0b0; padding:4px 14px;
               display:flex; gap:0; }
    .pma-tab { padding:6px 14px; background:#c8c8c8; border:1px solid #b0b0b0;
               border-bottom:none; cursor:pointer; font-size:12px; color:#333; }
    .pma-tab.active { background:#f8f8f8; font-weight:bold; color:#000; }
    .container { max-width:480px; margin:40px auto; background:#fff;
                 border:1px solid #ccc; padding:24px; }
    .login-title { font-size:14px; font-weight:bold; margin-bottom:20px; color:#333;
                   border-bottom:1px solid #ddd; padding-bottom:10px; }
    table { width:100%; border-collapse:collapse; }
    td { padding:6px 8px; vertical-align:middle; }
    td:first-child { width:120px; color:#555; font-size:12px; text-align:right; }
    input[type=text], input[type=password], select {
      width:180px; padding:4px 6px; border:1px solid #aaa; font-size:12px;
    }
    input:focus, select:focus { border-color:#5d90cd; outline:none; }
    .go-btn {
      background:linear-gradient(#f5f5f5,#dedede); border:1px solid #999;
      padding:5px 18px; font-size:12px; cursor:pointer; margin-top:8px;
    }
    .go-btn:hover { background:linear-gradient(#e8e8e8,#cecece); }
    .pma-error {
      background:#fbe3e4; border:1px solid #fbc2c4; padding:10px 14px;
      margin-top:14px; font-size:12px; color:#8a1f11;
    }
    .pma-footer { text-align:center; margin-top:20px; color:#888; font-size:11px; }
    .cookie-notice { background:#fffae5; border:1px solid #e6d98b; padding:8px 12px;
                     font-size:11px; color:#665a00; margin-bottom:16px; }
  </style>
</head>
<body>
  <div class="pma-header">
    <div class="pma-logo">phpMyAdmin</div>
    <div class="pma-version">4.9.10</div>
  </div>
  <div class="pma-nav">
    <div class="pma-tab active">Connexion</div>
    <div class="pma-tab">Documentation</div>
  </div>

  <div class="container">
    <div class="cookie-notice">
      ⚠ Les cookies doivent être activés au-delà de cette page.
    </div>
    <div class="login-title">Bienvenue dans phpMyAdmin</div>

    <form method="POST">
      <table>
        <tr>
          <td>Langue :</td>
          <td>
            <select name="lang">
              <option selected>Français</option>
              <option>English</option>
              <option>Español</option>
            </select>
          </td>
        </tr>
        <tr><td colspan="2"><hr style="border:none;border-top:1px solid #eee;margin:8px 0"/></td></tr>
        <tr>
          <td>Serveur :</td>
          <td><input type="text" name="pma_servername" value="127.0.0.1"/></td>
        </tr>
        <tr>
          <td>Identifiant :</td>
          <td><input type="text" name="pma_username" value="root" autofocus/></td>
        </tr>
        <tr>
          <td>Mot de passe :</td>
          <td><input type="password" name="pma_password"/></td>
        </tr>
        <tr>
          <td>Type d'auth :</td>
          <td>
            <select name="auth_type">
              <option selected>cookie</option>
              <option>http</option>
              <option>config</option>
            </select>
          </td>
        </tr>
        <tr>
          <td></td>
          <td><button type="submit" class="go-btn">Exécuter →</button></td>
        </tr>
      </table>
    </form>

    {% if error %}
    <div class="pma-error">{{ error }}</div>
    {% endif %}

    <div class="pma-footer">
      Version : 4.9.10 | MySQL : 8.0.36 | PHP : 8.2.15
    </div>
  </div>
</body>
</html>
