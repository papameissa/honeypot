<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}HoneyTrap{% endblock %} — AYMEI TECH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="navbar">
    <div class="nav-brand">
      <span class="hex-icon">⬡</span>
      <span class="brand-text">HONEY<span class="accent">TRAP</span></span>
      <span class="brand-sub">by AYMEI TECH</span>
    </div>
    <nav class="nav-links">
      <a href="{{ url_for('dashboard.index') }}" class="nav-item {% if request.endpoint == 'dashboard.index' %}active{% endif %}">
        ▸ Dashboard
      </a>
      <a href="{{ url_for('api.get_attacks') }}" class="nav-item" target="_blank">▸ API</a>
      <a href="{{ url_for('export.download_csv') }}" class="nav-item">▸ Export CSV</a>
      <a href="{{ url_for('export.download_json') }}" class="nav-item">▸ Export JSON</a>
    </nav>
    <div class="nav-status">
      <span class="status-dot"></span>
      <span class="status-text">LIVE</span>
    </div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>HoneyTrap © 2025 — Manny · L3 RI ISI Keur Massar · DEVNET Exam</span>
    <span class="footer-tech">Flask · PostgreSQL · Docker · Redis</span>
  </footer>

  <script src="{{ url_for('static', filename='js/live.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
